name: chatapp-mongodb

services:
  mongo:
    image: mongo:7.0.40
    command:
      ['mongod', '--replSet', 'chatapp-rs', '--bind_ip_all', '--port', '27017']
    ports:
      - '127.0.0.1:${CHATAPP_MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'quit(db.hello().isWritablePrimary && db.hello().setName === "chatapp-rs" ? 0 : 1)',
        ]
      interval: 3s
      timeout: 4s
      retries: 30
  mongo-init:
    image: mongo:7.0.40
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./init-replica.js:/init-replica.js:ro
    entrypoint: ['mongosh', '--nodb', '--quiet', '/init-replica.js']
  objects:
    image: ghcr.io/versity/versitygw:v1.11.0
    profiles: [attachments]
    command: ['--port', ':9000', '--quiet', 'posix', '/data']
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      VGW_REGION: ${S3_REGION:-us-east-1}
    ports:
      - '${CHATAPP_S3_BIND:-127.0.0.1}:${CHATAPP_S3_PORT:-9000}:9000'
    volumes:
      - object-data:/data
volumes:
  object-data:
  mongo-data:
