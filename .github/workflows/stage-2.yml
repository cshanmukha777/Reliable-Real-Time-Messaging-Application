name: ChatApp foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_PUBLIC_API_BASE_URL: https://api.example.com
  EXPO_PUBLIC_ALLOW_LOCAL_HTTP: 'false'

jobs:
  static:
    name: Install and static quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  backend:
    name: Backend and HTTP health
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:api

  mobile:
    name: Expo compatibility and native exports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build:contracts
      - run: npm run doctor -w @chatapp/mobile
      - run: npm run dependencies:check -w @chatapp/mobile
      - run: npm run router:check -w @chatapp/mobile
      - run: npm run typecheck -w @chatapp/mobile
      - name: Export Android and iOS bundles
        env:
          DATABASE_URL: mongodb://CHATAPP_SERVER_ONLY_CANARY.invalid/chatapp_test
          CHATAPP_SERVER_ONLY_CANARY: CHATAPP_SERVER_ONLY_CANARY
        run: |
          npm run export:android -w @chatapp/mobile
          npm run export:ios -w @chatapp/mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-exports
          path: apps/mobile/dist
          if-no-files-found: error
          retention-days: 3

  database:
    name: Replica-set database integration
    runs-on: ubuntu-24.04
    env:
      CHATAPP_TEST_DATABASE_URL: mongodb://127.0.0.1:27017/chatapp_test?replicaSet=chatapp-rs&directConnection=true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: docker compose -f infrastructure/mongodb/compose.yml up -d mongo
      - run: docker compose -f infrastructure/mongodb/compose.yml run --rm mongo-init
      - run: npm run prisma:generate
      - run: npm run test:db
      - if: failure()
        run: docker compose -f infrastructure/mongodb/compose.yml logs --no-color mongo
      - if: always()
        run: docker compose -f infrastructure/mongodb/compose.yml down --volumes

  security:
    name: Secret and mobile bundle checks
    runs-on: ubuntu-24.04
    needs: mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-exports
          path: apps/mobile/dist
      - run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 git --redact --no-banner /repo
          node scripts/check-security.mjs
